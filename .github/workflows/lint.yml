name: Lint

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      # Error-level checks only: syntax errors and undefined names. These are
      # things that are broken regardless of style, so this gate is meaningful
      # for scripts that cannot be run in CI -- they need a network analyser.
      - name: Check for syntax errors and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Style is reported but never fails the build.
      - name: Style report (advisory)
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
